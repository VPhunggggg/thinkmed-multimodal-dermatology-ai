# YOLO12 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo12
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 5 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo12n.yaml' will call yolo12.yaml with scale 'n'
  # [depth, width, max_channels]
  m: [0.50, 1.00, 512] # summary: 292 layers, 20,199,168 parameters, 20,199,152 gradients, 68.1 GFLOPs

# YOLO12n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]] # 8

# YOLO12n head
head:
  # ── FPN top-down ─────────────────────────────────────────────
  - [-1,    1, nn.Upsample, [None, 2, 'nearest']]  #  9  up P5→40×40     512
  - [[-1, 6], 1, Concat,    [1]]                    # 10  cat P4-back  512+512=1024
  - [-1,    1, A2C2f,       [512, False, -1]]        # 11  P4 neck      1024→512

  - [-1,    1, nn.Upsample, [None, 2, 'nearest']]  # 12  up P4→80×80     512
  - [[-1, 4], 1, Concat,    [1]]                    # 13  cat P3-back  512+512=1024
  - [-1,    1, A2C2f,  [256, False, -1]]    # 14  P3 neck
  - [-1, 1, ClassAwareMGA, [256, 5, 64]]            # 15  MGA @ P3
  - [-1,     1, Conv,  [256, 3, 2]]          # 16
  - [[-1,11], 1, Concat,[1]]                 # 17
  - [-1,     1, A2C2f, [512, False, -1]]     # 18  P4 BU
  - [-1, 1, ClassAwareMGA, [512, 5, 64]]            # 19  MGA @ P4
  - [-1,    1, Conv,   [512, 3, 2]]          # 20
  - [[-1, 8], 1, Concat,[1]]                 # 21
  - [-1,    1, C3k2,   [512, True]]          # 22
  - [[15, 19, 22], 1, Detect, [nc]]          # 23
